name: Export branch source

on:
  push:
    branches:
      - agent/increment-1-foundation
    paths:
      - .github/export/READY

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          mkdir -p .github/export
          git archive --format=zip --output=.github/export/source.zip HEAD
      - name: Commit source archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/export/source.zip
          git commit -m 'Export branch source for validation'
          git push origin HEAD:agent/increment-1-foundation

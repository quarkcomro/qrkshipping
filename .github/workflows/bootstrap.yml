name: Bootstrap approved Increment 1 source

on:
  push:
    branches:
      - agent/increment-1-foundation
    paths:
      - .github/bootstrap/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and decode approved source payload
        run: |
          cat .github/bootstrap/chunk* | base64 --decode > /tmp/qrkshipping-source.tar.xz
          echo '5c04f8222b6a7225048ca025ddf0b26f78e540a63358e8de6ba1e868e76bc582  /tmp/qrkshipping-source.tar.xz' \
            | sha256sum --check --strict
          mkdir -p /tmp/qrkshipping-source
          tar -xJf /tmp/qrkshipping-source.tar.xz -C /tmp/qrkshipping-source

      - name: Replace bootstrap tree with approved source
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/qrkshipping-source/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Increment 1 foundation'
          git push origin HEAD:agent/increment-1-foundation

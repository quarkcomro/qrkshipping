name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qrkshipping-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static and unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2.32', '8.3', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring, openssl, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run static, architecture, unit and artifact gates
        run: composer quality

  database:
    name: Database / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MariaDB 10.6
            image: mariadb:10.6
          - name: MariaDB 10.11.9
            image: mariadb:10.11.9
          - name: MySQL 8.0
            image: mysql:8.0
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: qrk_root_password
          MARIADB_DATABASE: qrk_bootstrap
          MYSQL_ROOT_PASSWORD: qrk_root_password
          MYSQL_DATABASE: qrk_bootstrap
        ports:
          - 3306:3306
    env:
      QRK_DB_ADMIN_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
      QRK_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=qrkshipping;charset=utf8mb4
      QRK_DB_USER: root
      QRK_DB_PASSWORD: qrk_root_password
      QRK_DB_NAME: qrkshipping
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.32'
          extensions: dom, json, mbstring, openssl, pdo_mysql, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare strict utf8mb4 database
        run: php scripts/prepare-test-database.php

      - name: Execute real database suite
        run: composer test:database

  runtime:
    name: PrestaShop 9.1.4 runtime / PHP ${{ matrix.php }} / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MariaDB 10.6
            php: '8.2.32'
            image: mariadb:10.6
          - name: MariaDB 10.11.9
            php: '8.3'
            image: mariadb:10.11.9
          - name: MySQL 8.0
            php: '8.4'
            image: mysql:8.0
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: qrk_root_password
          MARIADB_DATABASE: qrk_bootstrap
          MYSQL_ROOT_PASSWORD: qrk_root_password
          MYSQL_DATABASE: qrk_bootstrap
        ports:
          - 3306:3306
    env:
      QRK_DB_ADMIN_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
      QRK_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=prestashop_runtime;charset=utf8mb4
      QRK_DB_USER: root
      QRK_DB_PASSWORD: qrk_root_password
      QRK_DB_NAME: prestashop_runtime
      QRK_DB_CHARSET: utf8
      QRK_DB_COLLATION: utf8_general_ci
      QRK_EXPECT_LEGACY_DB_DEFAULT: '1'
      QRK_PS_ROOT: ${{ github.workspace }}/prestashop
      PRESTASHOP_VERSION: 9.1.4
    steps:
      - name: Check out QRK Shipping
        uses: actions/checkout@v4

      - name: Check out PrestaShop 9.1.4
        uses: actions/checkout@v4
        with:
          repository: PrestaShop/PrestaShop
          ref: 9.1.4
          path: prestashop
          fetch-depth: 1

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, iconv, intl, json, mbstring, mysqli, openssl, pdo_mysql, simplexml, xml, zip
          ini-values: memory_limit=-1
          tools: composer:v2
          coverage: none

      - name: Install QRK Shipping development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Build the module release payload
        env:
          SOURCE_DATE_EPOCH: '1783728000'
        run: composer build

      - name: Install PrestaShop dependencies
        run: composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress

      - name: Prepare strict utf8mb4 database
        run: php scripts/prepare-test-database.php

      - name: Install PrestaShop from the official source tree
        run: |
          php -d memory_limit=-1 prestashop/install-dev/index_cli.php \
            --domain=localhost \
            --db_server=127.0.0.1 \
            --db_user=root \
            --db_password=qrk_root_password \
            --db_name=prestashop_runtime \
            --prefix=psrt_ \
            --db_clear=1 \
            --db_create=0 \
            --language=en \
            --all_languages=0 \
            --country=ro \
            --timezone=Europe/Bucharest \
            --name='QRK Runtime' \
            --firstname=Runtime \
            --lastname=Admin \
            --email=runtime@example.test \
            --password='QrkRuntime-9.1.4!' \
            --fixtures=0 \
            --rewrite=0

      - name: Install the release ZIP into PrestaShop
        run: unzip -q dist/qrkshipping-0.1.2.zip -d prestashop/modules

      - name: Install QRK Shipping
        run: |
          php prestashop/bin/console prestashop:module install qrkshipping --env=prod --no-debug
          php scripts/prestashop-runtime-check.php installed

      - name: Validate Symfony routes, services, Twig and XLIFF
        run: |
          for route in \
            admin_qrkshipping_dashboard \
            admin_qrkshipping_preferences \
            admin_qrkshipping_preferences_update \
            admin_qrkshipping_help \
            admin_qrkshipping_diagnostics
          do
            php prestashop/bin/console debug:router "$route" --env=prod --no-debug
          done
          for service in \
            'Qrk\Commerce\Shipping\Controller\Admin\DashboardController' \
            'Qrk\Commerce\Shipping\Controller\Admin\PreferencesController' \
            'Qrk\Commerce\Shipping\Controller\Admin\HelpController' \
            'Qrk\Commerce\Shipping\Controller\Admin\DiagnosticsController'
          do
            php prestashop/bin/console debug:container "$service" --env=prod --no-debug
          done
          php prestashop/bin/console lint:twig \
            prestashop/modules/qrkshipping/views/templates/admin --env=prod --no-debug
          php prestashop/bin/console lint:xliff \
            prestashop/modules/qrkshipping/translations --env=prod --no-debug

      - name: Validate disable and enable lifecycle
        run: |
          php prestashop/bin/console prestashop:module disable qrkshipping --env=prod --no-debug
          php scripts/prestashop-runtime-check.php disabled
          php prestashop/bin/console prestashop:module enable qrkshipping --env=prod --no-debug
          php scripts/prestashop-runtime-check.php enabled

      - name: Validate default reset retention
        run: |
          php scripts/prestashop-runtime-check.php seeded
          php prestashop/bin/console prestashop:module reset qrkshipping --env=prod --no-debug
          php scripts/prestashop-runtime-check.php reset_retained

      - name: Validate explicit reset-to-defaults policy while disabled
        run: |
          php scripts/prestashop-runtime-check.php seed_reset_defaults
          php prestashop/bin/console prestashop:module disable qrkshipping --env=prod --no-debug
          php scripts/prestashop-runtime-check.php disabled
          php prestashop/bin/console prestashop:module reset qrkshipping --env=prod --no-debug
          php scripts/prestashop-runtime-check.php reset_defaults

      - name: Validate default uninstall retention and mandatory secret deletion
        run: |
          php scripts/prestashop-runtime-check.php seeded
          php prestashop/bin/console prestashop:module uninstall qrkshipping --env=prod --no-debug
          php scripts/prestashop-runtime-check.php uninstalled

      - name: Validate reinstall through exact schema adoption
        run: |
          php prestashop/bin/console prestashop:module install qrkshipping --env=prod --no-debug
          php scripts/prestashop-runtime-check.php reinstalled

      - name: Validate explicit destructive uninstall policy
        run: |
          php scripts/prestashop-runtime-check.php seed_uninstall_purge
          php prestashop/bin/console prestashop:module uninstall qrkshipping --env=prod --no-debug
          php scripts/prestashop-runtime-check.php uninstalled_purged

      - name: Validate reinstall after destructive uninstall
        run: |
          php prestashop/bin/console prestashop:module install qrkshipping --env=prod --no-debug
          php scripts/prestashop-runtime-check.php reinstalled_after_purge

  artifact:
    name: Reproducible release artifact
    runs-on: ubuntu-24.04
    needs: [static, database, runtime]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.32'
          extensions: dom, json, mbstring, openssl, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Build module ZIP twice
        env:
          SOURCE_DATE_EPOCH: '1783728000'
        run: |
          composer build
          first_sha="$(cut -d' ' -f1 dist/qrkshipping-0.1.2.zip.sha256)"
          composer build
          second_sha="$(cut -d' ' -f1 dist/qrkshipping-0.1.2.zip.sha256)"
          test "$first_sha" = "$second_sha"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: qrkshipping-0.1.2
          path: |
            dist/qrkshipping-0.1.2.zip
            dist/qrkshipping-0.1.2.zip.sha256
            dist/BUILD_REPORT.json
          if-no-files-found: error

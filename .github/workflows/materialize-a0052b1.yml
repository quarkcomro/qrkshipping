name: Materialize approved Increment 1 source

on:
  push:
    branches:
      - agent/increment-1-foundation
    paths:
      - .github/publish-a0052b1/READY
  pull_request:
    branches:
      - main
    paths:
      - .github/publish-a0052b1/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out bootstrap tree
        uses: actions/checkout@v4
        with:
          ref: agent/increment-1-foundation
          fetch-depth: 0

      - name: Configure minimum supported PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.32'
          extensions: dom, json, mbstring, openssl, xml, zip
          tools: composer:v2
          coverage: none

      - name: Capture transport diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/qrkshipping-source /tmp/qrkshipping-transport-diagnostics
          report=/tmp/qrkshipping-transport-diagnostics/report.txt
          {
            echo 'expected_archive_sha256=0f0431c7806fbbbd293f157e57258548496f2c1869ceffaf001e1378daf76c0d'
            echo 'logical_chunk_count=14'
            for file in .github/publish-a0052b1/chunk{00..11} .github/publish-a0052b1/chunk12{a..f} .github/publish-a0052b1/chunk13; do
              printf '%s bytes=' "$file"
              wc -c < "$file"
              printf '%s git_blob=' "$file"
              git hash-object "$file"
              sha256sum "$file"
            done
          } > "$report"
          {
            cat .github/publish-a0052b1/chunk{00..11}
            cat .github/publish-a0052b1/chunk12{a..f}
            cat .github/publish-a0052b1/chunk13
          } > /tmp/qrkshipping-source.tar.xz.b64
          printf 'base64_bytes=' >> "$report"
          wc -c < /tmp/qrkshipping-source.tar.xz.b64 >> "$report"
          sha256sum /tmp/qrkshipping-source.tar.xz.b64 >> "$report"
          base64 --decode /tmp/qrkshipping-source.tar.xz.b64 > /tmp/qrkshipping-source.tar.xz
          echo 'base64_decode_status='$? >> "$report"
          printf 'archive_bytes=' >> "$report"
          wc -c < /tmp/qrkshipping-source.tar.xz >> "$report"
          sha256sum /tmp/qrkshipping-source.tar.xz >> "$report"
          xz --test /tmp/qrkshipping-source.tar.xz
          echo 'xz_test_status='$? >> "$report"
          tar -tJf /tmp/qrkshipping-source.tar.xz > /tmp/qrkshipping-transport-diagnostics/archive-files.txt
          echo 'tar_list_status='$? >> "$report"
          cat "$report"

      - name: Upload transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-1-transport-diagnostics
          path: /tmp/qrkshipping-transport-diagnostics
          if-no-files-found: error
          retention-days: 3

      - name: Verify and decode the approved source tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/qrkshipping-source
          {
            cat .github/publish-a0052b1/chunk{00..11}
            cat .github/publish-a0052b1/chunk12{a..f}
            cat .github/publish-a0052b1/chunk13
          } > /tmp/qrkshipping-source.tar.xz.b64
          base64 --decode /tmp/qrkshipping-source.tar.xz.b64 > /tmp/qrkshipping-source.tar.xz
          echo '0f0431c7806fbbbd293f157e57258548496f2c1869ceffaf001e1378daf76c0d  /tmp/qrkshipping-source.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/qrkshipping-source.tar.xz -C /tmp/qrkshipping-source

      - name: Replace bootstrap files with the approved source
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/qrkshipping-source/. .

      - name: Resolve the reproducible development lock at the minimum PHP baseline
        run: |
          set -euo pipefail
          composer update --no-install --prefer-dist --no-interaction --no-progress
          composer validate --strict --no-check-publish

      - name: Commit the materialized Increment 1 tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize Increment 1 foundation (a0052b1)'
          git push origin HEAD:agent/increment-1-foundation
